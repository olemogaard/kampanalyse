html,body,#root{height:100%;background:var(--bg);color:var(--text);

.auth-logo{font-size:11px;letter-spacing:.15em;color:var(--blue);font-weight:700;

.auth-title{font-size:20px;font-weight:700;color:var(--text);margin-bottom:18px;}

/* ── App layout ── */
.header{background:var(--hdr);padding:10px 18px 0;position:sticky;top:0;

.header-top{display:flex;justify-content:space-between;align-items:flex-start;}
.match-title{font-size:20px;font-weight:700;color:#fff;line-height:1.2;}
.match-meta{display:flex;gap:10px;align-items:center;margin-top:4px;flex-wrap:wrap;}
.score{font-size:26px;font-weight:800;}
.content{padding:14px 18px;overflow-y:auto;height:calc(100vh - 108px);}

.tabs{display:flex;gap:0;margin-top:10px;overflow-x:auto;}

<script>
const SS_AUTH='kampanalyse_auth';
function doPwLogin(){
  var v=document.getElementById('pw-input').value.trim();
  if(v===window.ACCESS_PASSWORD){
    try{sessionStorage.setItem(SS_AUTH,'1');}catch(e){}
    document.getElementById('screen-pw').style.display='none';
  }else{
    document.getElementById('pw-err').textContent='Feil passord.';
    document.getElementById('pw-input').value='';
  }
}
document.addEventListener('DOMContentLoaded',function(){
  var btn=document.getElementById('pw-btn');
  var inp=document.getElementById('pw-input');
  if(btn)btn.addEventListener('click',doPwLogin);
  if(inp)inp.addEventListener('keydown',function(e){if(e.key==='Enter')doPwLogin();});
  try{
    if(sessionStorage.getItem(SS_AUTH)==='1')
      document.getElementById('screen-pw').style.display='none';
  }catch(e){}
});
</script>

/* ── Persistent storage: IndexedDB with localStorage fallback ──── */
const _DB_NAME='nff_db_v1',_STORE='kv';
let _dbP=null;
function _openDB(){
  if(_dbP)return _dbP;
  _dbP=new Promise((resolve,reject)=>{
    try{
      const req=indexedDB.open(_DB_NAME,1);
      req.onupgradeneeded=e=>{const db=e.target.result;if(!db.objectStoreNames.contains(_STORE))db.createObjectStore(_STORE);};
      req.onsuccess=e=>resolve(e.target.result);
      req.onerror=()=>reject(req.error);
    }catch(e){reject(e);}
  });
  return _dbP;
}
async function idbSet(key,val){
  try{
    const db=await _openDB();
    return await new Promise((resolve,reject)=>{
      const tx=db.transaction(_STORE,'readwrite');
      tx.objectStore(_STORE).put(val,key);
      tx.oncomplete=()=>resolve(true);
      tx.onerror=()=>reject(tx.error);
    });
  }catch(e){
    try{localStorage.setItem('idb_'+key,JSON.stringify(val));return true;}catch(e2){return false;}
  }
}
async function idbGet(key){
  try{
    const db=await _openDB();
    return await new Promise((resolve,reject)=>{
      const tx=db.transaction(_STORE,'readonly');
      const req=tx.objectStore(_STORE).get(key);
      req.onsuccess=()=>resolve(req.result??null);
      req.onerror=()=>reject(req.error);
    });
  }catch(e){
    try{const v=localStorage.getItem('idb_'+key);return v?JSON.parse(v):null;}catch(e2){return null;}
  }
}
async function idbDel(key){
  try{
    const db=await _openDB();
    return await new Promise((resolve)=>{
      const tx=db.transaction(_STORE,'readwrite');
      tx.objectStore(_STORE).delete(key);
      tx.oncomplete=()=>resolve(true);
      tx.onerror=()=>resolve(false);
    });
  }catch(e){try{localStorage.removeItem('idb_'+key);}catch(e2){}return false;}
}

/* ── Workspace export/import ───────────────────────────────────── */
function exportWorkspace(matches){
  const data={version:1,exported:new Date().toISOString(),matches};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download=`nff_arbeidsomrade_${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function importWorkspace(file){
  return new Promise((resolve,reject)=>{
    const r=new FileReader();
    r.onload=()=>{
      try{
        const data=JSON.parse(r.result);
        if(data.matches&&Array.isArray(data.matches))resolve(data.matches);
        else if(Array.isArray(data))resolve(data);
        else reject(new Error('Ugyldig format'));
      }catch(e){reject(e);}
    };
    r.onerror=()=>reject(new Error('Kunne ikke lese fil'));
    r.readAsText(file);
  });
}

// Format 1: UTF-8 Team XML (Ball in play, KFUM-style)
function parseTeamXMLv1(xml, fn) {
  const doc = new DOMParser().parseFromString(xml, 'text/xml');
  const insts = Array.from(doc.querySelectorAll('instance'));
  const code = i => i.querySelector('code')?.textContent || '';
  function labels(inst) {
    const d = {};
    inst.querySelectorAll('label').forEach(l => {
      const g = l.querySelector('group')?.textContent;
      const t = l.querySelector('text')?.textContent;
      if (g && t) {
        if (!d[g]) d[g] = [];
        d[g].push(t);
      }
    });
    return d;
  }
  const bip = insts.filter(i => code(i) === 'Ball in play');
  const total = bip.length;
  // Detect team names from possessions
  const teamCodes = insts.map(i => code(i)).filter(c => c.includes('Possessions'));
  const teamNames = teamCodes.map(c => c.replace(' - Possessions', ''));
  const uniqueTeams = [...new Set(teamNames)];
  // Find stabæk side
  const stab = uniqueTeams.find(t => t.toLowerCase().includes('stab')) || uniqueTeams[0] || 'Hjemmelag';
  const opp = uniqueTeams.find(t => t !== stab) || uniqueTeams[1] || 'Bortelag';
  const stabPoss = insts.filter(i => code(i) === `${stab} - Possessions`).length;

  const stabSh = insts.filter(i => code(i) === `${stab} - Shots` || code(i) === `${stab} - Goals`).length;
  const oppSh = insts.filter(i => code(i) === `${opp} - Shots` || code(i) === `${opp} - Goals`).length;
  const stabGo = insts.filter(i => code(i) === `${stab} - Goals`).length;
  const oppGo = insts.filter(i => code(i) === `${opp} - Goals`).length;
  const stabCo = insts.filter(i => code(i) === `${stab} - Corners`).length;

  const stabA = insts.filter(i => code(i) === `${stab} - Open play attacks`).length;
  const oppA = insts.filter(i => code(i) === `${opp} - Open play attacks`).length;
  let ht = 0,
    ft = 0;
  const pd = {};
  bip.forEach(inst => {
    const l = labels(inst);
    const eT = l['03 - End location third'] || [];
    const tr = l['08 - Transition'] || [];
    const ou = l['07 - Outcome'] || [];
    const pl = l['10 - Players'] || [];
    if (tr.includes('High')) ht++;
    if (eT.includes('Final third')) ft++;
    pl.forEach(p => {
      if (!pd[p]) pd[p] = {
        total: 0,
        finalThird: 0,
        highTrans: 0,
        shot: 0
      };
      pd[p].total++;
      if (eT.includes('Final third')) pd[p].finalThird++;
      if (tr.includes('High')) pd[p].highTrans++;
      if (ou.some(o => ['Shot', 'Shot on goal', 'Goal'].includes(o))) pd[p].shot++;
    });
  });
  const sm = fn.match(/(\d+)-(\d+)/),

  const players = Object.entries(pd).map(([name, s]) => {
    const jm = name.match(/^(\d+)\./);
    const j = jm ? parseInt(jm[1]) : 0;
    return {
      name,
      jersey: j,
      isStabek: j > 0,
      pos: 'CM',
      passes: s.total,
      total: s.total,
      finalThird: s.finalThird,
      finalThirdP: s.total ? Math.round(s.finalThird / s.total * 100) : 0,

      interceptions: null,
      recoveries: null,
      aerial_duels: null,
      v1_defense: null,
      dribbles: null,
      clearances: null,
      saves: null,
      distributions: null,
      long_passes: null,
      crosses: null

  });
  return {

    date: dm ? dm[0] : '?',

    oppShots: oppSh,
    maal: sF,
    oppGoals: sA,
    highTrans: ht,

    dodPlusMinus: null,

  const buf = await file.arrayBuffer();
  const bytes = new Uint8Array(buf);
  const utf16 = bytes[1] === 0 && bytes[3] === 0 && bytes[5] === 0 && bytes[7] === 0;
  const xml = new TextDecoder(utf16 ? 'utf-16-le' : 'utf-8').decode(buf);
  // Detect format
  if (xml.includes('Ball in play')) return parseTeamXMLv1(xml, file.name);
  if (xml.match(/^\s*<SportswareXML/) || xml.includes('Defending style of play') || xml.includes('Attacking style of play')) return parseTeamXMLv2(xml, file.name);
  if (xml.match(/\(\d+\)/)) return parsePlayerXMLv2(xml, file.name);
  if (xml.match(/\d+\. /)) return parsePlayerXMLv3(xml, file.name);
  return null;
}

function generateNarrativeNFF(player, match, allKpisArr) {

  }
  const best = PHASES.filter(ph => phaseScores[ph].t > 0).sort((a, b) => phaseScores[b].pct - phaseScores[a].pct)[0];
  const worst = PHASES.filter(ph => phaseScores[ph].t > 0).sort((a, b) => phaseScores[a].pct - phaseScores[b].pct)[0];
  const phLbl = {
    angrep: 'angrepsfasen',
    forsvar: 'forsvarsfasen',
    omstilling: 'omstillingsfasen'
  };
  if (best && phaseScores[best].pct >= 70) lines.push(`Sterkest i ${phLbl[best]} med ${phaseScores[best].p}/${phaseScores[best].t} krav.`);
  if (worst && worst !== best && phaseScores[worst].pct < 50) lines.push(`Forbedringspotensial i ${phLbl[worst]} (${phaseScores[worst].p}/${phaseScores[worst].t} krav).`);
  if (hasMins) lines.push(`Spillte ${mins} minutter — verdier normalisert til P90.`);

[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Content-Security-Policy = "default-src 'self' 'unsafe-inline' 'unsafe-eval' https://unpkg.com https://fonts.googleapis.com https://fonts.gstatic.com https://generativelanguage.googleapis.com; connect-src 'self' https://generativelanguage.googleapis.com;"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
